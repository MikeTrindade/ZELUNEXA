name: Ajuste de metadados de produção

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-metadata-fix.yml'

permissions:
  contents: write

jobs:
  fix-production-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajustar dominio oficial e metadados
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          BASE = 'https://zelunexa.com.br'
          LEGACY_BASE = 'https://zelunexa.vercel.app'
          OG = f'{BASE}/assets/img/og-image.png'
          LOGO = f'{BASE}/assets/img/zelunexa-logo.svg'
          pages = {
              'index.html': f'{BASE}/',
              'monitor.html': f'{BASE}/monitor.html',
              'guia.html': f'{BASE}/guia.html',
              'sobre.html': f'{BASE}/sobre.html',
              'contato.html': f'{BASE}/contato.html',
              'area-do-cliente.html': f'{BASE}/area-do-cliente.html',
              'privacidade.html': f'{BASE}/privacidade.html',
              'termos.html': f'{BASE}/termos.html',
          }

          for path in list(pages) + ['404.html']:
              p = Path(path)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8').replace(LEGACY_BASE, BASE)
              s = re.sub(r'<meta property="og:image" content="[^"]+">', f'<meta property="og:image" content="{OG}">', s, count=1)
              s = re.sub(r'<meta property="og:image:secure_url" content="[^"]+">', f'<meta property="og:image:secure_url" content="{OG}">', s, count=1)
              s = re.sub(r'<meta name="twitter:image" content="[^"]+">', f'<meta name="twitter:image" content="{OG}">', s, count=1)
              if path in pages:
                  url = pages[path]
                  s = re.sub(r'<meta property="og:url" content="[^"]+">', f'<meta property="og:url" content="{url}">', s, count=1)
                  s = re.sub(r'<link rel="canonical" href="[^"]+">', f'<link rel="canonical" href="{url}">', s, count=1)
              s = s.replace(f'"logo":"{LEGACY_BASE}/assets/img/zelunexa-logo.svg"', f'"logo":"{LOGO}"')
              p.write_text(s, encoding='utf-8')

          Path('robots.txt').write_text(f'User-agent: *\nAllow: /\n\nSitemap: {BASE}/sitemap.xml\n', encoding='utf-8')
          urls = [
              (f'{BASE}/', '1.0', 'monthly'),
              (f'{BASE}/monitor.html', '0.9', 'monthly'),
              (f'{BASE}/guia.html', '0.9', 'monthly'),
              (f'{BASE}/sobre.html', '0.7', 'monthly'),
              (f'{BASE}/contato.html', '0.8', 'monthly'),
              (f'{BASE}/area-do-cliente.html', '0.5', 'monthly'),
              (f'{BASE}/privacidade.html', '0.3', 'yearly'),
              (f'{BASE}/termos.html', '0.3', 'yearly'),
          ]
          xml = ['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for url, priority, changefreq in urls:
              xml += ['  <url>', f'    <loc>{url}</loc>', f'    <changefreq>{changefreq}</changefreq>', f'    <priority>{priority}</priority>', '  </url>']
          xml.append('</urlset>')
          xml_text = '\n'.join(xml) + '\n'
          Path('sitemap.xml').write_text(xml_text, encoding='utf-8')
          Path('sitemap.template.xml').write_text(xml_text, encoding='utf-8')
          PY

      - name: Ampliar video principal da Home no desktop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/css/styles.css')
          s = p.read_text(encoding='utf-8')
          start = '/* === V12 HOME DESKTOP: video principal ampliado === */'
          end = '/* === FIM V12 HOME DESKTOP === */'
          s = re.sub(re.escape(start) + r'.*?' + re.escape(end), '', s, flags=re.S).rstrip()
          lines = [
              '', '', start,
              '@media (min-width: 1051px) {',
              '  .hero .hero-grid {',
              '    grid-template-columns: minmax(0, .86fr) minmax(0, 1.14fr);',
              '    gap: clamp(30px, 2.4vw, 46px);',
              '  }',
              '',
              '  .hero .hero-visual--motion {',
              '    width: calc(100% + clamp(210px, 14vw, 280px));',
              '    min-height: clamp(560px, 41vw, 640px);',
              '    margin-right: calc(clamp(210px, 14vw, 280px) * -1);',
              '    overflow: hidden;',
              '    display: flex;',
              '    align-items: center;',
              '    justify-content: flex-end;',
              '  }',
              '',
              '  .hero .hero-video-shell {',
              '    width: 100%;',
              '    height: 100%;',
              '    min-height: inherit;',
              '    aspect-ratio: auto;',
              '    overflow: hidden;',
              '    margin: 0;',
              '    -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.72) 4%, #000 11%, #000 100%);',
              '    mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.72) 4%, #000 11%, #000 100%);',
              '  }',
              '',
              '  .hero .hero-impact-video {',
              '    width: 100%;',
              '    height: 100%;',
              '    min-height: inherit;',
              '    object-fit: cover;',
              '    object-position: 78% 50%;',
              '    transform: scale(1.22);',
              '    transform-origin: 78% 50%;',
              '  }',
              '',
              '  .hero .hero-video-overlay {',
              '    background: linear-gradient(90deg, rgba(6,16,31,.54) 0%, rgba(6,16,31,.16) 8%, transparent 19%), linear-gradient(180deg, rgba(6,16,31,.06) 0%, transparent 14%, transparent 86%, rgba(6,16,31,.14) 100%), radial-gradient(circle at 66% 50%, rgba(0,207,244,.05), transparent 64%);',
              '  }',
              '}',
              end,
          ]
          p.write_text(s + '\n'.join(lines) + '\n', encoding='utf-8')
          Path('VERSION.txt').write_text('Zelunexa Site Oficial v12 - video principal ampliado no desktop\n', encoding='utf-8')
          PY

      - name: Commit das correcoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html monitor.html guia.html sobre.html contato.html area-do-cliente.html privacidade.html termos.html 404.html robots.txt sitemap.xml sitemap.template.xml VERSION.txt assets/css/styles.css
          git commit -m "Amplia video principal da Home no desktop" || exit 0
          git push
