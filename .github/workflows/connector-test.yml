name: Connector test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download test file from staging
        run: |
          curl --fail --location \
            --cookie-jar /tmp/vercel-cookies.txt \
            --cookie /tmp/vercel-cookies.txt \
            "https://zelunexa-gvg06ewje-mikes-projects-c34ab6a2.vercel.app/test.txt?_vercel_share=C1jhUwDSULx7l4Fjx91hnAyaZms0wbAr" \
            --output VERCEL_TEST_RESULT.txt
          echo "Downloaded bytes: $(wc -c < VERCEL_TEST_RESULT.txt)"
          cat VERCEL_TEST_RESULT.txt
      - name: Commit test result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERCEL_TEST_RESULT.txt
          git commit -m "Valida transferência automatizada de arquivos" || exit 0
          git push
